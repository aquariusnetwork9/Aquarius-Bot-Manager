#cloud-config
# Provision a fresh Ubuntu VPS with Aquarius Bot Manager on first boot.
# Paste this into your provider's "user data" / cloud-init field when creating the box.
# Adjust ABM_RUN_USER to the box's login user (Ubuntu cloud images: "ubuntu").
package_update: true
package_upgrade: true
packages:
  - python3
  - tmux
  - unzip
  - wget
  - git
  - curl
# For public HTTPS instead of a tunnel, add  ABM_ACCESS=https ABM_DOMAIN=bots.example.com  to the line below.
runcmd:
  - 'curl -fsSL https://raw.githubusercontent.com/aquariusnetwork9/Aquarius-Bot-Manager/main/install.sh | ABM_RUN_USER=ubuntu ABM_ACCESS=tunnel bash'
final_message: "Aquarius Bot Manager installed. SSH-tunnel to 127.0.0.1:8765 and open http://localhost:8765 — first visit creates your login, then Deploy proxies."
