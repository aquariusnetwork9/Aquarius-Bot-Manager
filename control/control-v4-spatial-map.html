<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ABM · Live Map</title>
<link rel="stylesheet" href="/control/leaflet.css">
<style>
:root{ --bg:#070a0f; --txt:#e3ebf3; --dim:#7e90a3; --line:#ffffff1f; --acc:#3ddc97; --acc2:#5cc8ff;
  --amber:#ffb454; --crash:#ff5d5d; --glass:rgba(13,19,28,.82);
  --mono:ui-monospace,'Space Mono',monospace; --sans:'Sora',system-ui,sans-serif; }
*{box-sizing:border-box}
body{margin:0;height:100vh;overflow:hidden;color:var(--txt);font-family:var(--sans);background:var(--bg)}
button,a.btn{font-family:var(--sans);cursor:pointer;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--txt);
  padding:.4rem .7rem;border-radius:9px;font-weight:600;font-size:.78rem;transition:.14s;backdrop-filter:blur(6px);text-decoration:none;white-space:nowrap}
button:hover,a.btn:hover{border-color:var(--acc)}
button.go{border-color:#1f7a55;color:var(--acc);background:#3ddc9714}
.stage{position:relative;height:100vh;width:100vw}
#map{position:absolute;inset:0;background:#05080d;cursor:crosshair}
/* leaflet dark-theme overrides */
.leaflet-container{background:#05080d;font-family:var(--sans);outline:none}
.leaflet-bar{border:1px solid var(--line);box-shadow:0 6px 24px #0008}
.leaflet-bar a{background:var(--glass);color:var(--txt);border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}
.leaflet-bar a:hover{background:#1a2533;color:var(--acc)}
.leaflet-control-zoom{margin-top:64px!important}
.leaflet-tile{image-rendering:pixelated}
/* bot + entity markers */
.botmk{position:relative}
.botmk .core{position:absolute;left:50%;top:50%;width:13px;height:13px;margin:-6.5px 0 0 -6.5px;border-radius:50%;background:var(--acc);box-shadow:0 0 16px var(--acc)}
.botmk .ring{position:absolute;left:50%;top:50%;width:13px;height:13px;margin:-6.5px 0 0 -6.5px;border:1.5px solid #3ddc9766;border-radius:50%;animation:rg 2.4s ease-out infinite}
.botmk .nm{position:absolute;left:14px;top:-7px;font-family:var(--mono);font-size:.62rem;color:var(--acc);white-space:nowrap;text-shadow:0 1px 3px #000}
@keyframes rg{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.4);opacity:0}}
.destmk{width:16px;height:16px;border:2px solid var(--acc);border-radius:50%;box-shadow:0 0 10px var(--acc);background:#3ddc9733}
.topbar{position:absolute;left:14px;top:14px;right:14px;z-index:600;display:flex;align-items:center;gap:.55rem;flex-wrap:wrap;pointer-events:none}
.topbar>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:.5rem;font-weight:800;font-size:.86rem;background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:.4rem .7rem;backdrop-filter:blur(12px)}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--crash);box-shadow:0 0 10px var(--crash)}
.brand .dot.on{background:var(--acc);box-shadow:0 0 10px var(--acc)}
.vchip{display:inline-flex;align-items:center;gap:.6rem;font-family:var(--mono);font-size:.68rem;color:var(--dim);background:var(--glass);
  border:1px solid var(--line);border-radius:11px;padding:.4rem .65rem;backdrop-filter:blur(12px)}
.vchip .hp{color:var(--crash)} .vchip .fd{color:var(--amber)} .vchip .ps{color:var(--acc2)}
.layers{position:absolute;right:14px;top:60px;z-index:600;background:var(--glass);border:1px solid var(--line);border-radius:12px;
  padding:.55rem .7rem;backdrop-filter:blur(12px);min-width:166px;font-size:.76rem;box-shadow:0 10px 30px #0007}
.layers h4{margin:.1rem 0 .5rem;font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:700}
.layers label{display:flex;align-items:center;gap:.5rem;padding:.2rem 0;cursor:pointer;user-select:none}
.layers label:hover{color:var(--acc)}
.layers input{accent-color:var(--acc);width:14px;height:14px;cursor:pointer}
.layers .sep{height:1px;background:var(--line);margin:.4rem 0}
.layers .sw{display:inline-block;width:11px;height:11px;border-radius:3px;flex:0 0 auto}
.coordlbl{position:absolute;left:14px;bottom:12px;z-index:600;font-family:var(--mono);font-size:.66rem;color:var(--dim);background:var(--glass);
  border:1px solid var(--line);border-radius:9px;padding:.4rem .65rem;backdrop-filter:blur(10px)}
.coordlbl b{color:var(--acc2)}
.recenter{position:absolute;right:14px;bottom:12px;z-index:600}
.readout{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:600;max-width:min(680px,calc(100vw - 28px));
  font-family:var(--mono);font-size:.7rem;color:var(--txt);background:var(--glass);border:1px solid var(--line);border-radius:11px;
  padding:.5rem .8rem;backdrop-filter:blur(12px);display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;justify-content:center}
.readout b{color:var(--acc)} .readout .mono{font-family:var(--mono);color:var(--acc2)}
.readout button{padding:.28rem .55rem;font-size:.72rem}
@media(max-width:640px){ .vchip{display:none} .layers{top:54px} }
/* record toggle */
#recbtn.rec{border-color:var(--crash);color:#ffd0d0;background:#ff5d5d1f}
.recdot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--crash);box-shadow:0 0 8px var(--crash);animation:recpulse 1.1s ease-in-out infinite;vertical-align:-1px;margin-right:3px}
@keyframes recpulse{0%,100%{opacity:1}50%{opacity:.3}}
/* right-click context menu */
.ctxmenu{position:fixed;z-index:1200;min-width:196px;background:var(--glass);border:1px solid var(--line);border-radius:11px;
  padding:.3rem;backdrop-filter:blur(14px);box-shadow:0 14px 40px #000a;font-size:.78rem}
.ctxmenu .hd{font-family:var(--mono);font-size:.63rem;color:var(--dim);padding:.28rem .6rem .34rem}
.ctxmenu .ci{display:flex;align-items:center;gap:.55rem;padding:.44rem .6rem;border-radius:8px;cursor:pointer;color:var(--txt);white-space:nowrap}
.ctxmenu .ci:hover{background:#ffffff12;color:var(--acc)}
.ctxmenu .ci .ic{width:16px;text-align:center;opacity:.9}
.ctxmenu .sep{height:1px;background:var(--line);margin:.25rem .3rem}
/* waypoint markers */
.wpmk{position:relative}
.wpmk i{position:absolute;left:-6px;top:-6px;width:11px;height:11px;border-radius:50% 50% 50% 0;transform:rotate(45deg);background:var(--c,#5cc8ff);border:1.5px solid #0b1018;box-shadow:0 0 8px var(--c,#5cc8ff)}
.wpmk b{position:absolute;left:9px;top:-9px;font-family:var(--mono);font-size:.6rem;font-weight:600;color:#dfe9f3;white-space:nowrap;text-shadow:0 1px 3px #000;background:#0b1018aa;padding:0 3px;border-radius:3px}
.mmk{width:10px;height:10px;border-radius:50%;background:#ffb454;border:2px solid #0b1018;box-shadow:0 0 8px #ffb454}
/* toasts */
#toast{position:absolute;left:50%;top:58px;transform:translateX(-50%);z-index:1300;display:flex;flex-direction:column;gap:.4rem;align-items:center;pointer-events:none}
#toast .tt{background:var(--glass);border:1px solid var(--line);border-radius:9px;padding:.45rem .8rem;font-size:.74rem;backdrop-filter:blur(12px);box-shadow:0 8px 24px #0008;animation:ttin .18s ease}
#toast .tt.err{border-color:#5a2b2b;color:#ffb4b4}
@keyframes ttin{from{opacity:0;transform:translateY(-6px)}to{opacity:1}}
</style></head>
<body><div class="stage">
  <div id="map"></div>
  <div class="topbar">
    <a class="brand btn" id="backlink" href="#" title="Back to control surface"><span class="dot" id="conn"></span><span id="brandname">ABM</span></a>
    <span class="vchip" id="vitals">—</span>
    <button class="btn" id="recbtn" title="Save the chunks this bot explores to its map (toggle). Past chunks stay visible either way.">● Record</button>
  </div>
  <div id="toast"></div>
  <div class="layers" id="layers">
    <h4>Layers</h4>
    <label><input type="checkbox" id="ly_sat" checked><span class="sw" style="background:#3a5a78"></span>Satellite</label>
    <label><input type="checkbox" id="ly_obs"><span class="sw" style="background:#6a4bbd"></span>Obsidian</label>
    <label><input type="checkbox" id="ly_new"><span class="sw" style="background:#ff3b3b"></span>New chunks</label>
    <label><input type="checkbox" id="ly_live"><span class="sw" style="background:#3ddc97"></span>Live render</label>
    <label><input type="checkbox" id="ly_explored"><span class="sw" style="background:#c88bff"></span>Explored</label>
    <label><input type="checkbox" id="ly_wp" checked><span class="sw" style="background:#5cc8ff"></span>Waypoints</label>
    <div class="sep"></div>
    <label><input type="checkbox" id="ly_grid"><span class="sw" style="background:#9fb3c8"></span>Grid</label>
    <label><input type="checkbox" id="ly_hwy" checked><span class="sw" style="background:#ffd24a"></span>Highways</label>
    <div class="sep"></div>
    <label><input type="checkbox" id="ly_follow" checked><span class="sw" style="background:#5cc8ff"></span>Follow bot</label>
  </div>
  <div class="coordlbl" id="coordlbl">connecting…</div>
  <button class="btn recenter" id="recenter" title="Recenter on bot">⌖ Recenter</button>
  <div class="readout" id="readout">Click the map to set an Elytra destination.</div>
</div>
<script src="/control/leaflet.js"></script>
<script>
(function(){
  'use strict';
  var Q=new URLSearchParams(location.search);
  var INST=Q.get('inst')||'';
  var MOCK=Q.get('mock');
  var DIRECT=Q.get('direct')==='1'||Q.get('direct')==='true';
  var STYLE=Q.get('style')||'';
  var TILESRC=(Q.get('tilesrc')||'proxy').toLowerCase();      // proxy (default, cached on VPS) | direct (browser→2b2t.place)
  var DIRECT_HOST='https://2b2t.place';
  var BASE = MOCK ? MOCK.replace(/\/+$/,'') : DIRECT ? '' : ('/api/instances/'+encodeURIComponent(INST));
  var TILEBASE = location.origin + '/api/map/tile';           // global, non-instance-scoped proxy
  function api(p){ return BASE+p; }

  /* ---- world<->latlng projection (CRS.Simple scaled by 2^MAXLOD) ----
     lat = world Z, lng = world X.  A tile at native zoom z covers 512·2^(MAXLOD-z) blocks,
     so leaflet zoom z maps to the site's LOD = MAXLOD - z, and tile (x,y) == their (tx,ty). */
  var MAXLOD=10, SCALE_DEN=1<<MAXLOD;           // 1024
  var HWY_MAX=5000000;                          // highway half-length (blocks) — well past the snapshot
  function w2ll(x,z){ return L.latLng(z, x); }
  function ll2w(ll){ return { x: Math.round(ll.lng), z: Math.round(ll.lat) }; }
  var crs = L.extend({}, L.CRS.Simple, { transformation: new L.Transformation(1/SCALE_DEN, 0, 1/SCALE_DEN, 0) });

  var DIM=0;                                    // 0 overworld · 1 nether · 2 end (driven by the bot)
  function dimId(d){ d=(d||'').toLowerCase(); return d.indexOf('nether')>=0?1:d.indexOf('end')>=0?2:0; }
  function prettyDim(d){ return d===1?'Nether':d===2?'The End':'Overworld'; }

  document.title='ABM · Live Map · '+(INST||'bot');
  document.getElementById('brandname').textContent=INST||'bot';
  var back=document.getElementById('backlink');
  var bu=new URL('/control', location.origin);
  if(INST) bu.searchParams.set('inst', INST);
  if(STYLE) bu.searchParams.set('style', STYLE);
  if(MOCK) bu.searchParams.set('mock', MOCK);
  if(DIRECT) bu.searchParams.set('direct','1');
  back.href=bu.toString();

  /* ---------------- map ---------------- */
  var map = L.map('map', {
    crs: crs, center: w2ll(0,0), zoom: 2,
    minZoom: 0, maxZoom: 13, zoomSnap: 0, zoomDelta: 0.6, wheelPxPerZoomLevel: 90,
    zoomControl: true, attributionControl: false, preferCanvas: true, inertia: true,
    worldCopyJump: false, fadeAnimation: false
  });
  // explicit pane stacking: tiles(200) < live render(350) < grid(405) < highways(410) < markers(600)
  map.createPane('liverender'); map.getPane('liverender').style.zIndex=350; map.getPane('liverender').style.pointerEvents='none';
  map.createPane('grid');       map.getPane('grid').style.zIndex=405;       map.getPane('grid').style.pointerEvents='none';
  map.createPane('highways');   map.getPane('highways').style.zIndex=410;   map.getPane('highways').style.pointerEvents='none';
  map.createPane('entities');   map.getPane('entities').style.zIndex=500;   map.getPane('entities').style.pointerEvents='none';

  /* ---- satellite / obsidian / new-chunks tile layers (2b2t.place pyramid) ---- */
  function trunc(n){ return n<0 ? Math.ceil(n) : Math.floor(n); }
  function makeTileLayer(layerName, zidx){
    var Cls = L.TileLayer.extend({
      getTileUrl: function(c){
        var lod = Math.max(0, Math.min(10, MAXLOD - c.z));
        var tx=c.x, ty=c.y;
        if(TILESRC==='direct')
          return DIRECT_HOST+'/tiles/'+layerName+'/'+lod+'/'+DIM+'/'+trunc(tx/32)+'/'+trunc(ty/32)+'/t.'+tx+'.'+ty+'.webp';
        return TILEBASE+'/'+layerName+'/'+lod+'/'+DIM+'/'+tx+'/'+ty;
      }
    });
    return new Cls(null, { tileSize:512, minNativeZoom:0, maxNativeZoom:10, noWrap:true,
                           zIndex:zidx, keepBuffer:2, updateWhenZooming:false, crossOrigin:false });
  }
  var satLayer = makeTileLayer('base', 1);
  var obsLayer = makeTileLayer('overlay', 2);
  var newLayer = makeTileLayer('newchunks', 3);
  satLayer.addTo(map);

  /* ---- Explored overlay: this bot's persistent recorded chunk map (per-bot). Stored as lod0
     (512-block) tiles on the ABM; Leaflet fetches native z10 tiles and scales them for other zooms.
     `?v=` is bumped on each redraw while recording so freshly-saved tiles refresh in place. ---- */
  var exploredVer = 1;
  var ExpCls = L.TileLayer.extend({ getTileUrl: function(c){ return api('/map/explored/'+DIM+'/0/'+c.x+'/'+c.y)+'?v='+exploredVer; } });
  var exploredLayer = new ExpCls(null, { tileSize:512, minNativeZoom:10, maxNativeZoom:10, noWrap:true,
                                         zIndex:4, keepBuffer:2, updateWhenZooming:false, opacity:.96 });

  /* ---- highways (the 8 nether roads: axes + x=±z diagonals from origin) ---- */
  var hwyRenderer = L.canvas({ pane:'highways' });
  var AX={color:'#ffd24a',weight:1.4,opacity:.85,interactive:false,renderer:hwyRenderer};
  var DG={color:'#ff9e4a',weight:1.2,opacity:.7,interactive:false,renderer:hwyRenderer};
  var hwyGroup = L.layerGroup([
    L.polyline([w2ll(-HWY_MAX,0), w2ll(HWY_MAX,0)], AX),     // X axis  (z=0)
    L.polyline([w2ll(0,-HWY_MAX), w2ll(0,HWY_MAX)], AX),     // Z axis  (x=0)
    L.polyline([w2ll(-HWY_MAX,-HWY_MAX), w2ll(HWY_MAX,HWY_MAX)], DG),  // x=z
    L.polyline([w2ll(-HWY_MAX,HWY_MAX), w2ll(HWY_MAX,-HWY_MAX)], DG)   // x=-z
  ]);
  hwyGroup.addTo(map);

  /* ---- world-aligned grid (adaptive spacing, Xaero-style) ---- */
  var gridRenderer = L.canvas({ pane:'grid' });
  var gridGroup = L.layerGroup();
  var GRID_STEPS=[16,32,64,128,256,512,1024,2048,4096,8192,16384,32768,65536,131072,262144,524288];
  function rebuildGrid(){
    if(!map.hasLayer(gridGroup)) return;
    gridGroup.clearLayers();
    var b=map.getBounds(), w0=ll2w(b.getNorthWest()), w1=ll2w(b.getSouthEast());
    var minX=Math.min(w0.x,w1.x), maxX=Math.max(w0.x,w1.x);
    var minZ=Math.min(w0.z,w1.z), maxZ=Math.max(w0.z,w1.z);
    // pick a step so lines sit ~70px apart on screen
    var ppb=(map.project(w2ll(1,0),map.getZoom()).x - map.project(w2ll(0,0),map.getZoom()).x);
    var step=GRID_STEPS[GRID_STEPS.length-1];
    for(var i=0;i<GRID_STEPS.length;i++){ if(GRID_STEPS[i]*ppb>=70){ step=GRID_STEPS[i]; break; } }
    var sub={color:'#9fb3c8',weight:.5,opacity:.22,interactive:false,renderer:gridRenderer};
    var x0=Math.floor(minX/step)*step, z0=Math.floor(minZ/step)*step;
    for(var x=x0; x<=maxX; x+=step){
      var st = (x===0)?{color:'#ffffff',weight:1.1,opacity:.55,interactive:false,renderer:gridRenderer}:sub;
      gridGroup.addLayer(L.polyline([w2ll(x,minZ), w2ll(x,maxZ)], st));
    }
    for(var z=z0; z<=maxZ; z+=step){
      var st2 = (z===0)?{color:'#ffffff',weight:1.1,opacity:.55,interactive:false,renderer:gridRenderer}:sub;
      gridGroup.addLayer(L.polyline([w2ll(minX,z), w2ll(maxX,z)], st2));
    }
  }
  map.on('moveend zoomend', rebuildGrid);

  /* ---- live bot render (the bot's own freshly-rendered chunks, /viewer/map.png) ---- */
  var liveOverlay=null, liveSpan=256;
  function refreshLive(){
    if(!document.getElementById('ly_live').checked || !state) return;
    var x=state.x, z=state.z, h=liveSpan/2;
    var bounds=[ w2ll(x-h, z-h), w2ll(x+h, z+h) ];
    var url=api('/viewer/map?size='+liveSpan)+'&t='+Date.now();
    if(!liveOverlay){ liveOverlay=L.imageOverlay(url, bounds, {pane:'liverender', opacity:.92, interactive:false}); liveOverlay.addTo(map); }
    else { liveOverlay.setBounds(bounds); liveOverlay.setUrl(url); }
  }

  /* ---- bot + entity markers ---- */
  var entRenderer=L.canvas({pane:'entities', padding:.5});
  var entGroup=L.layerGroup().addTo(map);
  var botIcon=L.divIcon({className:'', html:'<div class="botmk"><div class="ring"></div><div class="core"></div><div class="nm" id="botnm">—</div></div>', iconSize:[0,0]});
  var botMarker=L.marker(w2ll(0,0), {icon:botIcon, interactive:false, keyboard:false, zIndexOffset:1000});
  var destMarker=null;
  function hostile(t){ return /ZOMBIE|SKELET|CREEPER|WITHER|BLAZE|PIGLIN|HOGLIN|GHAST|ENDERMAN|SPIDER|SLIME|MAGMA|VEX|VINDICATOR|PILLAGER|RAVAGER|WARDEN|PHANTOM|DROWNED|HUSK|STRAY|GUARDIAN|SHULKER|WITCH/i.test(t||''); }
  function entStyle(t){ t=(t||'').toUpperCase();
    if(t.indexOf('PLAYER')>=0) return {r:5,color:'#0b1018',weight:1,fillColor:'#5cc8ff',fillOpacity:1};
    if(t.indexOf('ITEM')>=0)   return {r:3,color:'#0b1018',weight:1,fillColor:'#ffb454',fillOpacity:.9};
    return hostile(t) ? {r:4,color:'#0b1018',weight:1,fillColor:'#ff5d5d',fillOpacity:1}
                      : {r:4,color:'#0b1018',weight:1,fillColor:'#9fe089',fillOpacity:.95}; }
  function drawEntities(s){
    entGroup.clearLayers();
    (s.entities||[]).forEach(function(e){
      var st=entStyle(e.type);
      var m=L.circleMarker(w2ll(e.x, e.z), {renderer:entRenderer, radius:st.r, color:st.color, weight:st.weight, fillColor:st.fillColor, fillOpacity:st.fillOpacity, interactive:false});
      entGroup.addLayer(m);
    });
  }

  /* ---------------- telemetry (SSE) ---------------- */
  var state=null, follow=true, didInitView=false, es=null;
  function setConn(on){ document.getElementById('conn').classList.toggle('on', !!on); }
  function startStream(){
    try{ es=new EventSource(api('/viewer/stream')); }catch(e){ return; }
    es.onmessage=function(ev){ try{ onState(JSON.parse(ev.data)); }catch(e){} };
    es.onerror=function(){ setConn(false); };
  }
  function onState(s){
    state=s; setConn(true);
    var nd=dimId(s.dimension);
    if(nd!==DIM){ DIM=nd; satLayer.redraw(); obsLayer.redraw(); newLayer.redraw(); exploredLayer.redraw(); drawWaypoints(); didInitView=false; }
    var ll=w2ll(s.x, s.z);
    botMarker.setLatLng(ll); if(!map.hasLayer(botMarker)) botMarker.addTo(map);
    var bn=document.getElementById('botnm'); if(bn) bn.textContent=(INST||'bot')+' · '+Math.round(s.x)+', '+Math.round(s.y)+', '+Math.round(s.z);
    document.getElementById('vitals').innerHTML=
      '<span class="hp">♥ '+Math.round(s.health||0)+'</span>'+
      '<span class="fd">🍗 '+Math.round(s.food||0)+'</span>'+
      '<span class="ps">⌖ '+Math.round(s.x)+', '+Math.round(s.y)+', '+Math.round(s.z)+'</span>'+
      '<span>'+prettyDim(DIM)+'</span>';
    drawEntities(s);
    if(!didInitView){ didInitView=true; map.setView(ll, Math.max(map.getZoom(), 9), {animate:false}); }
    else if(follow){ map.panTo(ll, {animate:true, duration:.5}); }
  }

  /* ---------------- coordinate readout + click-to-fly ---------------- */
  var coordlbl=document.getElementById('coordlbl');
  map.on('mousemove', function(ev){
    var w=ll2w(ev.latlng);
    var live = state ? ' · ● live · '+((state.entities&&state.entities.length)||0)+' nearby' : ' · ○ no bot feed';
    coordlbl.innerHTML='<b>'+w.x+', '+w.z+'</b> · '+prettyDim(DIM)+live;
  });
  map.on('click', function(ev){
    if(measureA){ finishMeasure(ev.latlng); return; }
    if(!state){ return; }
    var w=ll2w(ev.latlng);
    if(!destMarker){ destMarker=L.marker(ev.latlng, {icon:L.divIcon({className:'destmk', iconSize:[16,16]}), interactive:false}).addTo(map); }
    else destMarker.setLatLng(ev.latlng);
    var dd = DIM===1?'nether':DIM===2?'end':'overworld';
    var ro=document.getElementById('readout');
    ro.innerHTML='<b>Destination</b> <span class="mono">'+w.x+', ~'+Math.round(state.y)+', '+w.z+'</span> '+
      '<button class="go" id="send">▶ Send to Elytra</button><button id="clr">clear</button>';
    document.getElementById('send').onclick=function(){
      runCommand('fly trip '+dd+' '+w.x+' '+w.z).then(function(){
        ro.innerHTML='✅ Sent to Elytra Autopilot — flying to '+w.x+', '+w.z+' ('+dd+').';
      }).catch(function(e){ ro.innerHTML='⚠ '+(e.message||'failed to send'); });
    };
    document.getElementById('clr').onclick=function(){ if(destMarker){ map.removeLayer(destMarker); destMarker=null; } ro.textContent='Click the map to set an Elytra destination.'; };
  });
  function runCommand(cmd){
    return fetch(api('/control/command'), {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({command:cmd})})
      .then(function(r){ if(r.status===403) throw new Error('control disabled on this bot'); if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); });
  }

  /* ---------------- follow / recenter ---------------- */
  map.on('dragstart', function(){ follow=false; document.getElementById('ly_follow').checked=false; });
  document.getElementById('recenter').onclick=function(){
    follow=true; document.getElementById('ly_follow').checked=true;
    if(state) map.setView(w2ll(state.x,state.z), Math.max(map.getZoom(),9), {animate:true});
  };

  /* ---------------- layer toggles ---------------- */
  function bindLayer(id, layer){
    var cb=document.getElementById(id);
    cb.onchange=function(){ if(cb.checked) layer.addTo(map); else map.removeLayer(layer); if(id==='ly_grid'&&cb.checked) rebuildGrid(); };
  }
  bindLayer('ly_sat', satLayer);
  bindLayer('ly_obs', obsLayer);
  bindLayer('ly_new', newLayer);
  bindLayer('ly_hwy', hwyGroup);
  document.getElementById('ly_grid').onchange=function(){ if(this.checked){ gridGroup.addTo(map); rebuildGrid(); } else map.removeLayer(gridGroup); };
  document.getElementById('ly_live').onchange=function(){ if(this.checked){ refreshLive(); } else if(liveOverlay){ map.removeLayer(liveOverlay); liveOverlay=null; } };
  document.getElementById('ly_follow').onchange=function(){ follow=this.checked; if(follow&&state) map.setView(w2ll(state.x,state.z), Math.max(map.getZoom(),9), {animate:true}); };

  /* ================= spatial-map enrichment: record · waypoints · right-click menu ================= */
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function toast(msg, err){ var t=document.getElementById('toast'); if(!t) return;
    var d=document.createElement('div'); d.className='tt'+(err?' err':''); d.textContent=msg; t.appendChild(d);
    setTimeout(function(){ d.style.transition='opacity .3s'; d.style.opacity='0'; setTimeout(function(){ if(d.parentNode) d.remove(); },300); }, err?4200:2600); }
  function dd(){ return DIM===1?'nether':DIM===2?'end':'overworld'; }
  function otherDimText(x,z){ if(DIM===1) return 'Overworld ~'+(x*8)+', '+(z*8); if(DIM===0) return 'Nether ~'+Math.round(x/8)+', '+Math.round(z/8); return 'no OW/Nether pair'; }
  function nearestHighway(x,z){ var d=[['X-axis (z=0)',Math.abs(z)],['Z-axis (x=0)',Math.abs(x)],['diag x=z',Math.abs(x-z)/1.414],['diag x=-z',Math.abs(x+z)/1.414]];
    d.sort(function(a,b){return a[1]-b[1];}); return d[0][0]+' (~'+Math.round(d[0][1])+'b)'; }

  /* ---- waypoints (per-bot, persisted server-side) ---- */
  var wpGroup=L.layerGroup().addTo(map), waypoints=[];
  function drawWaypoints(){ wpGroup.clearLayers();
    waypoints.forEach(function(w){ if((w.dim||0)!==DIM) return;
      var icon=L.divIcon({className:'', html:'<div class="wpmk" style="--c:'+esc(w.color||'#5cc8ff')+'"><i></i><b>'+esc(w.label||'')+'</b></div>', iconSize:[0,0]});
      var m=L.marker(w2ll(w.x,w.z), {icon:icon});
      var box=document.createElement('div');
      box.innerHTML='<b>'+esc(w.label||'Waypoint')+'</b><br><span style="font-family:var(--mono)">'+w.x+', '+w.z+'</span><br>';
      var del=document.createElement('button'); del.textContent='delete'; del.style.marginTop='.3rem';
      del.onclick=function(){ deleteWaypoint(w.id); m.closePopup(); };
      box.appendChild(del); m.bindPopup(box); wpGroup.addLayer(m); }); }
  function loadWaypoints(){ if(!INST) return;
    fetch(api('/map/waypoints')).then(function(r){return r.ok?r.json():{};}).then(function(d){ waypoints=(d&&d.waypoints)||[]; drawWaypoints(); }).catch(function(){}); }
  function addWaypoint(x,z){ var label=window.prompt('Waypoint name:', 'WP '+x+','+z); if(label===null) return;
    fetch(api('/map/waypoints'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({x:x,z:z,dim:DIM,label:label||('WP '+x+','+z),color:'#5cc8ff'})})
      .then(function(r){ if(r.status===403) throw new Error('no permission'); return r.json(); })
      .then(function(d){ waypoints=(d&&d.waypoints)||waypoints; drawWaypoints(); toast('Waypoint saved'); })
      .catch(function(e){ toast('⚠ '+(e.message||'failed'), true); }); }
  function deleteWaypoint(id){
    fetch(api('/map/waypoints'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({del:id})})
      .then(function(r){return r.json();}).then(function(d){ waypoints=(d&&d.waypoints)||[]; drawWaypoints(); toast('Waypoint removed'); })
      .catch(function(e){ toast('⚠ '+(e.message||'failed'), true); }); }

  /* ---- record toggle (per-bot chunk recording) ---- */
  var recording=false, recTimer=null;
  function setRecUI(on){ recording=on; var b=document.getElementById('recbtn'); if(!b) return;
    b.classList.toggle('rec', on); b.innerHTML = on ? '<span class="recdot"></span>Recording' : '● Record'; }
  function startRecRefresh(){ if(recTimer) return; recTimer=setInterval(function(){ exploredVer++; if(map.hasLayer(exploredLayer)) exploredLayer.redraw(); }, 3000); }
  function stopRecRefresh(){ if(recTimer){ clearInterval(recTimer); recTimer=null; } }
  function showExplored(){ var cb=document.getElementById('ly_explored'); if(cb) cb.checked=true; if(!map.hasLayer(exploredLayer)) exploredLayer.addTo(map); }
  function loadRecordState(){ if(!INST) return;
    fetch(api('/map/record')).then(function(r){return r.ok?r.json():{};}).then(function(d){
      setRecUI(!!(d&&d.on)); if(d&&d.on){ showExplored(); startRecRefresh(); }
      if(d&&d.pil===false) toast('⚠ map recording needs Pillow on the server (python3-pil)', true); }).catch(function(){}); }
  function toggleRecord(){ if(!INST){ toast('no bot selected', true); return; }
    var want=!recording;
    fetch(api('/map/record'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({on:want})})
      .then(function(r){ if(r.status===403) throw new Error('no permission to control this bot'); if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
      .then(function(d){ setRecUI(!!d.on);
        if(d.on){ showExplored(); startRecRefresh(); toast('● Recording — chunks the bot explores now save to its map');
          if(d.pil===false) toast('⚠ server missing Pillow (python3-pil) — nothing will save', true); }
        else { stopRecRefresh(); toast('Recording stopped — saved chunks stay on the map'); } })
      .catch(function(e){ toast('⚠ '+(e.message||'failed'), true); }); }

  /* ---- measure mode (from the right-click point to the next click) ---- */
  var measureA=null, measureLine=null, measureMk=null;
  function startMeasure(w){ clearMeasure(); measureA=w;
    measureMk=L.marker(w2ll(w.x,w.z),{icon:L.divIcon({className:'mmk',iconSize:[10,10]}),interactive:false}).addTo(map);
    document.getElementById('readout').innerHTML='📏 Measuring from <span class="mono">'+w.x+', '+w.z+'</span> — click the second point.'; }
  function finishMeasure(latlng){ var b=ll2w(latlng), a=measureA;
    var dist=Math.round(Math.hypot(b.x-a.x, b.z-a.z));
    measureLine=L.polyline([w2ll(a.x,a.z), w2ll(b.x,b.z)], {color:'#ffb454',weight:1.5,dashArray:'5,5',interactive:false}).addTo(map);
    var mm=function(s){ s=Math.round(s); return s<60?s+'s':Math.floor(s/60)+'m '+(s%60)+'s'; };
    var ro=document.getElementById('readout');
    ro.innerHTML='📏 <b>'+dist+'</b> blocks · walk ~'+mm(dist/4.3)+' · elytra ~'+mm(dist/35)+' <button id="mclr">clear</button>';
    document.getElementById('mclr').onclick=clearMeasure; measureA=null; }
  function clearMeasure(){ measureA=null;
    if(measureLine){ map.removeLayer(measureLine); measureLine=null; } if(measureMk){ map.removeLayer(measureMk); measureMk=null; }
    var ro=document.getElementById('readout'); if(ro && ro.textContent.indexOf('📏')>=0) ro.textContent='Click the map to set an Elytra destination.'; }

  /* ---- right-click context menu ---- */
  var ctxEl=null;
  function closeMenu(){ if(ctxEl){ ctxEl.remove(); ctxEl=null; document.removeEventListener('click', closeMenu); document.removeEventListener('contextmenu', closeMenu, true); } }
  function menuItem(icon,label,fn){ var d=document.createElement('div'); d.className='ci'; d.innerHTML='<span class="ic">'+icon+'</span>'+esc(label);
    d.onclick=function(e){ e.stopPropagation(); closeMenu(); fn(); }; return d; }
  function showMenu(px,py,latlng){ closeMenu(); var w=ll2w(latlng);
    ctxEl=document.createElement('div'); ctxEl.className='ctxmenu';
    var hd=document.createElement('div'); hd.className='hd'; hd.textContent=w.x+', '+w.z+' · '+prettyDim(DIM); ctxEl.appendChild(hd);
    ctxEl.appendChild(menuItem('▶','Go here (fly)', function(){ if(!state){ toast('no bot feed', true); return; }
      runCommand('fly trip '+dd()+' '+w.x+' '+w.z).then(function(){ toast('▶ Flying to '+w.x+', '+w.z); }).catch(function(e){ toast('⚠ '+(e.message||'failed'), true); }); }));
    ctxEl.appendChild(menuItem('⧉','Copy coordinates', function(){
      var txt=w.x+', '+w.z+' ('+prettyDim(DIM)+') · '+otherDimText(w.x,w.z)+' · nearest '+nearestHighway(w.x,w.z);
      (navigator.clipboard&&navigator.clipboard.writeText? navigator.clipboard.writeText(txt): Promise.reject())
        .then(function(){ toast('Copied: '+w.x+', '+w.z); }).catch(function(){ window.prompt('Copy these coordinates:', txt); }); }));
    ctxEl.appendChild(menuItem('📍','Add waypoint', function(){ addWaypoint(w.x,w.z); }));
    ctxEl.appendChild(menuItem('📏','Measure distance', function(){ startMeasure(w); }));
    var sep=document.createElement('div'); sep.className='sep'; ctxEl.appendChild(sep);
    ctxEl.appendChild(menuItem('⌖','Center here', function(){ map.panTo(latlng,{animate:true}); }));
    ctxEl.appendChild(menuItem(recording?'⏹':'●', recording?'Stop recording':'Record chunks here', toggleRecord));
    document.body.appendChild(ctxEl);
    var mw=ctxEl.offsetWidth||200, mh=ctxEl.offsetHeight||250;
    ctxEl.style.left=Math.min(px, window.innerWidth-mw-8)+'px';
    ctxEl.style.top=Math.min(py, window.innerHeight-mh-8)+'px';
    setTimeout(function(){ document.addEventListener('click', closeMenu); document.addEventListener('contextmenu', closeMenu, true); }, 0); }
  map.on('contextmenu', function(ev){ L.DomEvent.preventDefault(ev.originalEvent); showMenu(ev.originalEvent.clientX, ev.originalEvent.clientY, ev.latlng); });

  /* ---- wire the new layer toggles + record button ---- */
  bindLayer('ly_explored', exploredLayer);
  document.getElementById('ly_wp').onchange=function(){ if(this.checked) wpGroup.addTo(map); else map.removeLayer(wpGroup); };
  document.getElementById('recbtn').onclick=toggleRecord;

  /* ---------------- boot ---------------- */
  if(!INST && !MOCK && !DIRECT){ coordlbl.textContent='no bot selected (missing ?inst=)'; }
  startStream();
  setInterval(refreshLive, 2000);
  loadWaypoints();
  loadRecordState();
})();
</script>
</body></html>
